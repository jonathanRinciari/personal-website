name: CI

on:
  pull_request:
    branches: [v2, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx astro check || true

      - name: Lint
        run: npx eslint src/

      - name: Build
        run: npm run build

      - name: Check for broken links
        run: npx lychee ./dist --no-progress --exclude 'jonrinciari.dev' --exclude 'linkedin.com' --exclude 'mailto:' || true
